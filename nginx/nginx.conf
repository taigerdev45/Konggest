worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ───
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ─── Performance ───
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─── Rate Limiting ───
    include /etc/nginx/rate-limiting.conf;

    # ─── Hide Nginx version ───
    server_tokens off;

    # ═══ HTTP → HTTPS Redirect ═══
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # ═══ HTTPS Main Server ═══
    server {
        listen 443 ssl http2;
        server_name localhost;

        # ─── TLS Configuration ───
        ssl_certificate /etc/nginx/ssl/konggest.crt;
        ssl_certificate_key /etc/nginx/ssl/konggest.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # ─── Security Headers ───
        include /etc/nginx/security-headers.conf;

        # ─── Block suspicious patterns (SQL injection, XSS in URL) ───
        if ($request_uri ~* "(union.*select|insert.*into|delete.*from|drop.*table|<script|javascript:|onerror=|onload=)") {
            return 403;
        }

        # ═══ Frontend (Next.js) ═══
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://konggest-frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ═══ Backend API (Django) ═══
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://konggest-backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ═══ Auth endpoints (stricter rate limit) ═══
        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://konggest-backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ═══ Django Admin (very strict) ═══
        location /admin/ {
            limit_req zone=auth burst=2 nodelay;
            proxy_pass http://konggest-backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ═══ Static files ═══
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ─── Block hidden files ───
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
