# ============================================
# KONGGEST - Docker Compose (Development)
# ============================================
# All services containerized with network isolation
# HTTPS enforced via Nginx reverse proxy

services:
  # ─── Nginx Reverse Proxy (HTTPS + WAF) ───
  konggest-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: konggest-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/rate-limiting.conf:/etc/nginx/rate-limiting.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      konggest-frontend:
        condition: service_healthy
      konggest-backend:
        condition: service_healthy
    networks:
      - konggest-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ─── Next.js Frontend ───
  konggest-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: konggest-frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - konggest-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Django Backend ───
  konggest-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: konggest-backend
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_ACCESS_TOKEN_LIFETIME_MINUTES=${JWT_ACCESS_TOKEN_LIFETIME_MINUTES}
      - JWT_REFRESH_TOKEN_LIFETIME_DAYS=${JWT_REFRESH_TOKEN_LIFETIME_DAYS}
    volumes:
      - ./backend:/app
    depends_on:
      konggest-db:
        condition: service_healthy
      konggest-redis:
        condition: service_healthy
    networks:
      - konggest-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── PostgreSQL Database ───
  konggest-db:
    image: postgres:15-alpine
    container_name: konggest-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - konggest-db-data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - konggest-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ─── Redis Cache ───
  konggest-redis:
    image: redis:7-alpine
    container_name: konggest-redis
    command: redis-server --requirepass konggest_redis_2024 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - konggest-redis-data:/data
    networks:
      - konggest-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "konggest_redis_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

# ─── Volumes ───
volumes:
  konggest-db-data:
    driver: local
  konggest-redis-data:
    driver: local

# ─── Network ───
networks:
  konggest-net:
    driver: bridge
    name: konggest-net
